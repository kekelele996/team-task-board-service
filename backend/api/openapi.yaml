openapi: 3.0.3
info:
  title: 团队任务看板 API
  version: 1.0.0
  description: Team Task Kanban REST API.
servers:
  - url: http://127.0.0.1:19503/api/v1
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: ok
  /auth/register:
    post:
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: created
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ok
  /workspaces:
    get:
      summary: List workspaces
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok
    post:
      summary: Create workspace
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string }
        email: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
