name: gbkanban

services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-gbkanban}-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gbkanban}
      MYSQL_USER: ${DB_USER:-gbkanban}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gbkanban}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gbkanban_root}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-57503}:3306"
    volumes:
      - gbkanban_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-gbkanban}-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      GIN_MODE: release
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-gbkanban}
      DB_PASSWORD: ${DB_PASSWORD:-gbkanban}
      DB_NAME: ${DB_NAME:-gbkanban}
      JWT_SECRET: ${JWT_SECRET:-gbkanban-dev-secret-change-me}
      JWT_TTL_HOURS: 168
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    ports:
      - "${BACKEND_PORT:-19503}:8080"
    volumes:
      - gbkanban_uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-gbkanban}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18503}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gbkanban_mysql_data:
  gbkanban_uploads_data:
